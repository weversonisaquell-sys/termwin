<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1c20">
<title>YouTube</title>
<style>
:root{--bg:#121316;--bar:#1b1c20;--c:#23252b;--c2:#30333b;--t:#f1f1f1;--s:#a3a7b0;--r:#ff3347;--g:linear-gradient(135deg,#ff3347,#ff7b6e)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[data-a],[data-go],[data-id],[data-ch],[data-s],[data-sub],[data-chip],[data-tab],.cd,.rl,.rs,.sc,button,.pg{cursor:pointer}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--t);font:14px Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
svg{display:block;pointer-events:none}
header{flex:none;height:54px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--bar);box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:6}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:active{background:var(--c2)}
.logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:19px;letter-spacing:-.8px;flex:none}
.logo img{width:30px;height:30px}
.sbx{flex:1;display:flex;justify-content:center;gap:10px;min-width:0}
.sb{display:flex;flex:1;max-width:560px;height:38px;border-radius:19px;overflow:hidden;background:#000;border:1px solid #2c2f36}
.sb input{flex:1;min-width:0;border:0;background:none;color:var(--t);padding:0 16px;font-size:14px;outline:0}
.sb button{width:58px;background:var(--c2);display:grid;place-items:center}
#mic{background:var(--g);color:#fff;box-shadow:0 3px 10px rgba(255,51,71,.45)}
.pill{height:36px;border-radius:18px;padding:0 13px;background:var(--c2);display:flex;align-items:center;gap:7px;font-size:13px;flex:none;position:relative}
.bdg{position:absolute;right:-2px;top:-3px;background:#f00;border-radius:9px;font-size:10px;padding:1px 5px;font-weight:700}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;flex:none}
.pill .av{width:26px;height:26px;font-size:12px}
.av.sm{width:24px;height:24px;font-size:12px}
.av.big{width:64px;height:64px;font-size:28px}
#app{flex:1;min-height:0;display:flex}
.nv{flex:none;width:74px;padding:6px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;background:var(--bar)}
.nv a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;font-size:10px;border-radius:12px}
.nv a.on{background:var(--g);color:#fff;box-shadow:0 3px 10px rgba(255,51,71,.35)}
body.ex .nv{width:178px}
body.ex .nv a{flex-direction:row;gap:18px;padding:10px 14px;font-size:13px}
body.wt .nv{display:none}
main{flex:1;min-width:0;position:relative}
.v{display:none;position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
.v.on{display:block}
.chips{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:10px 16px;background:var(--bg);overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:18px;background:var(--c);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--g);color:#fff;box-shadow:0 3px 10px rgba(255,51,71,.35)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:20px 14px;padding:6px 16px 28px}
.cd{min-width:0;background:var(--c);border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.cd .mt{padding:10px}
.th{position:relative;aspect-ratio:16/9;background:#1a1b1f;overflow:hidden}
.cd .th{border-radius:0}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th i{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);padding:1px 5px;border-radius:5px;font:600 11px Roboto,Arial}
.mt{display:flex;gap:10px}
.t{font-size:14px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.s{font-size:12px;color:var(--s);line-height:1.5}
.hd{display:flex;align-items:center;gap:8px;padding:10px 16px 0;font-size:18px;font-weight:700}
.hd svg{color:var(--r)}
.shl{display:flex;gap:12px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.sc{flex:none;width:132px}
.sc .th{aspect-ratio:9/16;border-radius:14px}
.emp{padding:40px 20px;text-align:center;color:var(--s)}
.btn{border-radius:20px;padding:9px 16px;background:var(--g);color:#fff;font-weight:600;font-size:13px;white-space:nowrap;box-shadow:0 3px 10px rgba(255,51,71,.35)}
.btn.on,.btn.al{background:var(--c2);color:var(--t);box-shadow:none}
.sub{border-radius:4px;padding:10px 18px;background:#f00;color:#fff;font-weight:700;font-size:13px;text-transform:uppercase;white-space:nowrap}
.sub.on{background:var(--c2);color:var(--s)}
.wp{display:flex;gap:20px;padding:12px 16px 28px}
.wl{flex:1;min-width:0}
.wr{flex:none;width:300px}
.pw{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;max-height:76vh;margin:0 auto}
.pw video{width:100%;height:100%;object-fit:contain;display:block}
.pw.fs{position:fixed;inset:0;z-index:15;max-height:none;border-radius:0;aspect-ratio:auto}
.pc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.45),transparent 40%,rgba(0,0,0,.7));opacity:0;transition:opacity .2s}
.pw.show .pc{opacity:1}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:18px;pointer-events:none}
.mid button{pointer-events:auto}
.rb{width:42px;height:42px;border-radius:50%;background:#fff;color:#23252b;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.rb.big{width:58px;height:58px}
.bot{padding:0 14px 8px}
.pg{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.3);margin:12px 0 6px;touch-action:none}
.pg i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--g);width:0}
.pg b{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#ff4a5b;box-shadow:0 0 0 3px rgba(255,255,255,.9);left:0}
.pg:before{content:"";position:absolute;inset:-12px 0}
.tm{display:flex;align-items:center;gap:12px;font-size:12px}
.tm button{display:grid;place-items:center;padding:4px}
.sp{flex:1}
.w1{font-size:17px;font-weight:700;margin:12px 0 8px;line-height:1.3}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nm{font-weight:600}
.pl{display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:18px;background:var(--c);font-size:13px;font-weight:500}
.pl.on{background:var(--g);color:#fff}
.pl.dis svg{transform:rotate(180deg)}
.hr{height:1px;background:var(--c2);margin:12px 0}
.rl{display:flex;gap:9px;margin-bottom:12px}
.rl .th{flex:none;width:150px;border-radius:10px}
.rs{display:flex;gap:14px;padding:8px 16px;max-width:900px}
.rs .th{flex:none;width:240px;border-radius:12px}
#shv{overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.sv{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 0}
.sf{position:relative;height:100%;aspect-ratio:9/16;max-width:92vw;background:#000;border-radius:16px;overflow:hidden}
.sf video{width:100%;height:100%;object-fit:cover}
.so{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:13px}
.sa{display:flex;flex-direction:column;gap:12px;align-self:flex-end;padding-bottom:12px}
.sa button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
.sa b{width:44px;height:44px;border-radius:50%;background:#fff;color:#23252b;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.sa .on b{background:var(--g);color:#fff}
.sa .dis svg{transform:rotate(180deg)}
#sn{display:none;position:absolute;right:14px;top:50%;transform:translateY(-50%);flex-direction:column;gap:10px;z-index:3}
body.sh #sn{display:flex}
#sn button{width:44px;height:44px;border-radius:50%;background:#fff;color:#23252b;display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;padding:6px 16px 12px}
.st{background:var(--c);border-radius:14px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.st b{display:block;font-size:24px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.st span{font-size:12px;color:var(--s)}
.dg{display:flex;gap:20px;align-items:center;padding:8px 16px 16px;flex-wrap:wrap}
.ring{width:116px;height:116px;border-radius:50%;background:conic-gradient(#ff3347 calc(var(--p)*1%),#3a3d46 0);display:grid;place-items:center;flex:none}
.ring>div{width:92px;height:92px;border-radius:50%;background:var(--bg);display:grid;place-content:center;text-align:center}
.ring b{font-size:22px}.ring span{font-size:10px;color:var(--s)}
.bars{display:flex;gap:10px;height:116px;flex:1;min-width:200px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bt{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bt i{width:100%;max-width:22px;border-radius:12px;background:var(--g)}
.bc span{font-size:11px;color:var(--s)}
#vo{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:20}
#vo.on{display:flex}
.vc{background:var(--c);border-radius:20px;padding:20px 28px;text-align:center;min-width:250px;max-width:80%}
.pu{width:62px;height:62px;border-radius:50%;background:var(--g);margin:0 auto 12px;display:grid;place-items:center;animation:pu 1.2s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(255,51,71,.6)}100%{box-shadow:0 0 0 26px rgba(255,51,71,0)}}
#sp{position:fixed;inset:0;background:var(--bg);z-index:30;display:grid;place-items:center;transition:opacity .4s}
#sp .logo{font-size:36px;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
#sp .logo img{width:64px;height:64px}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@media(max-width:760px){.wp{flex-direction:column}.wr{width:auto}.rs .th{width:150px}}
</style>
</head>
