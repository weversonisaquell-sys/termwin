<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1d3a">
<title>Windows 11</title>
<style>
:root{--ac:#0067c0;--ac2:#4cc2ff;--mica:rgba(32,32,32,.84);--mica2:rgba(44,44,44,.92);--fg:#fff;--sub:#c8c8c8;--card:rgba(255,255,255,.055);--hov:rgba(255,255,255,.085);--bd:rgba(255,255,255,.09);--shadow:0 8px 32px rgba(0,0,0,.45);--win:#202020;--win2:#2b2b2b;--inp:rgba(255,255,255,.06)}
body.light{--mica:rgba(243,243,243,.86);--mica2:rgba(250,250,250,.94);--fg:#1b1b1b;--sub:#5d5d5d;--card:rgba(0,0,0,.035);--hov:rgba(0,0,0,.06);--bd:rgba(0,0,0,.08);--shadow:0 8px 32px rgba(0,0,0,.2);--win:#f3f3f3;--win2:#fff;--inp:rgba(0,0,0,.04);--ac:#005fb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--fg);font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{display:block;pointer-events:none}
#scr{position:absolute;inset:0;overflow:hidden}
#wall{position:absolute;inset:0;background:#06142e;transition:filter .4s}
#wall svg{position:absolute;inset:0;width:100%;height:100%}
#wall.w1{filter:hue-rotate(75deg) saturate(1.15)}
#wall.w2{filter:hue-rotate(-120deg) saturate(1.2)}
#wall.w3{filter:hue-rotate(150deg) brightness(.9)}
body.light #wall{filter:brightness(1.35) saturate(.9)}
body.light #wall.w1{filter:hue-rotate(75deg) brightness(1.3)}
body.light #wall.w2{filter:hue-rotate(-120deg) brightness(1.3)}
body.light #wall.w3{filter:hue-rotate(150deg) brightness(1.2)}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9998}
#nl{position:absolute;inset:0;background:#ff9a2e;opacity:0;mix-blend-mode:multiply;pointer-events:none;z-index:9997;transition:opacity .4s}
/* lock + login */
#lock,#login,#off{position:absolute;inset:0;z-index:7500;color:#fff}
#lock{transition:transform .5s cubic-bezier(.7,0,.3,1),opacity .5s;display:flex;flex-direction:column;align-items:center;padding-top:9vh}
#lock:before,#login:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.12);z-index:-1}
#lock.up{transform:translateY(-100%);opacity:0;pointer-events:none}
#lk{font-size:min(14vh,104px);font-weight:600;letter-spacing:-2px;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.35)}
#ld{font-size:min(4.4vh,24px);margin-top:6px;font-weight:500;text-shadow:0 2px 10px rgba(0,0,0,.35)}
#lh{position:absolute;bottom:5vh;opacity:.85;font-size:13px}
#lbr{position:absolute;right:22px;bottom:18px;display:flex;gap:16px;align-items:center;opacity:.95}
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;backdrop-filter:blur(30px) brightness(.8);-webkit-backdrop-filter:blur(30px) brightness(.8);transition:opacity .45s;opacity:0;pointer-events:none}
#login.on{opacity:1;pointer-events:auto}
#login.gone{opacity:0;pointer-events:none}
.avt{width:min(26vh,150px);height:min(26vh,150px);border-radius:50%;background:linear-gradient(160deg,#7a8794,#4a5560);display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.avt svg{width:70%;height:70%}
#login .nm{font-size:min(5vh,26px);font-weight:600;margin-top:6px}
#login .pin{width:min(280px,70vw);height:34px;border-radius:6px;border:1px solid rgba(255,255,255,.3);border-bottom:2px solid #4cc2ff;background:rgba(0,0,0,.35);color:#fff;padding:0 12px;outline:0;margin-top:6px}
#login .go{margin-top:6px;padding:7px 28px;border-radius:5px;background:rgba(255,255,255,.2);font-weight:500}
#login .go:active{background:rgba(255,255,255,.3)}
#off{background:#000;display:none;place-items:center;font-size:14px;opacity:.9}
/* desktop */
#desk{position:absolute;left:0;right:0;top:0;bottom:48px}
#icons{position:absolute;inset:0;padding:8px 4px;display:grid;grid-template-columns:repeat(auto-fill,78px);grid-auto-rows:84px;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,84px);align-content:start;height:100%}
.di{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:4px;font-size:12px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.8);color:#fff;border:1px solid transparent;line-height:1.15}
.di.sel{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28)}
#wins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);border-radius:8px;box-shadow:0 14px 44px rgba(0,0,0,.55),0 0 0 1px var(--bd);pointer-events:auto;overflow:hidden;animation:wo .18s ease-out}
@keyframes wo{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.win.min{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.win:not(.act){box-shadow:0 8px 28px rgba(0,0,0,.35),0 0 0 1px var(--bd)}
.tbar{flex:none;height:34px;display:flex;align-items:center;background:var(--win);touch-action:none;gap:8px;padding-left:10px;font-size:12px}
.tbar .ti{width:16px;height:16px;flex:none}.tbar .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc{display:flex;height:100%}
.wc button{width:46px;height:100%;display:grid;place-items:center;color:var(--fg)}
.wc button:hover,.wc button:active{background:var(--hov)}
.wc .x:hover,.wc .x:active{background:#c42b1c;color:#fff}
.wb{flex:1;min-height:0;overflow:auto;position:relative;background:var(--win2);border-top:1px solid var(--bd)}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;z-index:3}
.win.max .rz{display:none}
/* taskbar */
#tb{position:absolute;left:0;right:0;bottom:0;height:48px;background:var(--mica);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);border-top:1px solid var(--bd);z-index:6000;display:flex;align-items:center;justify-content:space-between}
#tbw{display:flex;align-items:center;gap:8px;padding-left:12px;font-size:12px;min-width:0;width:170px;height:40px;border-radius:5px;margin-left:4px}
#tbw:hover{background:var(--hov)}
#tbw .t{line-height:1.15}#tbw .t b{display:block;font-weight:500;font-size:13px}#tbw .t span{color:var(--sub);font-size:11px}
#tbc{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;height:100%}
body.tbl #tbc{left:6px;transform:none}body.tbl #tbw{display:none}
.tbi{position:relative;width:40px;height:40px;border-radius:5px;display:grid;place-items:center;transition:background .12s,transform .1s}
.tbi:hover{background:var(--hov)}.tbi:active{transform:scale(.88);background:var(--hov)}
.tbi.run:after{content:"";position:absolute;bottom:2px;left:50%;margin-left:-3px;width:6px;height:3px;border-radius:2px;background:#9a9a9a;transition:width .15s,margin .15s}
.tbi.act{background:var(--card)}
.tbi.act:after{width:16px;margin-left:-8px;background:var(--ac2)}
#sbox{display:flex;align-items:center;gap:8px;height:34px;min-width:150px;padding:0 12px;border-radius:17px;background:var(--inp);border:1px solid var(--bd);font-size:12px;color:var(--sub);margin-right:4px}
#sbox:hover{background:var(--hov)}
#tr{display:flex;align-items:center;gap:2px;height:100%;padding-right:2px}
.tri{height:40px;min-width:32px;padding:0 6px;border-radius:5px;display:flex;align-items:center;justify-content:center;gap:10px}
.tri:hover,.tri:active{background:var(--hov)}
#clk{text-align:right;font-size:12px;line-height:1.25;padding:0 8px}
#sd{width:6px;height:100%;border-left:1px solid var(--bd);margin-left:2px}
#sd:hover{background:var(--hov)}
/* flyouts */
.fly{position:absolute;z-index:5900;background:var(--mica);backdrop-filter:blur(45px) saturate(1.6);-webkit-backdrop-filter:blur(45px) saturate(1.6);border:1px solid var(--bd);border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(24px);transition:opacity .2s,transform .24s cubic-bezier(.2,.9,.3,1)}
.fly.on{opacity:1;pointer-events:auto;transform:none}
#start{left:50%;margin-left:calc(min(600px,96vw)/-2);bottom:56px;width:min(600px,96vw);height:min(620px,calc(100% - 64px));display:flex;flex-direction:column}
body.tbl #start{left:8px;margin-left:0}
#sinp{margin:18px 24px 6px;display:flex;align-items:center;gap:10px;height:38px;border-radius:19px;background:var(--inp);border:1px solid var(--bd);border-bottom:2px solid var(--ac2);padding:0 14px;flex:none}
#sinp input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:14px}
#sbody{flex:1;min-height:0;overflow-y:auto;padding:4px 24px}
.sh{display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px;font-weight:600;font-size:13px}
.sh button{background:var(--card);padding:4px 10px;border-radius:4px;font-size:12px;font-weight:400;border:1px solid var(--bd)}
.pg{display:grid;grid-template-columns:repeat(6,1fr);gap:2px 4px}
.ai{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border-radius:6px;font-size:12px;text-align:center;line-height:1.15;min-width:0}
.ai:hover,.ai:active{background:var(--hov)}
.ai span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.ri{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;min-width:0}
.ri:hover,.ri:active{background:var(--hov)}
.ri div{min-width:0;line-height:1.25}.ri b{display:block;font-weight:400;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ri span{font-size:11px;color:var(--sub)}
.al{display:flex;align-items:center;gap:14px;padding:7px 10px;border-radius:6px}.al:hover,.al:active{background:var(--hov)}
#sft{flex:none;height:62px;background:rgba(0,0,0,.14);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-radius:0 0 8px 8px}
body.light #sft{background:rgba(0,0,0,.04)}
.us{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;font-size:13px}.us:hover,.us:active{background:var(--hov)}
.us .avt{width:30px;height:30px;box-shadow:none}
.pwr{width:40px;height:40px;border-radius:6px;display:grid;place-items:center}.pwr:hover,.pwr:active{background:var(--hov)}
#pm{position:absolute;right:22px;bottom:60px;background:var(--mica2);border:1px solid var(--bd);border-radius:8px;box-shadow:var(--shadow);padding:4px;display:none;min-width:150px}
#pm.on{display:block}#pm button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:4px;font-size:13px}#pm button:hover,#pm button:active{background:var(--hov)}
#qs{right:10px;bottom:56px;width:min(360px,96vw);padding:18px;display:block}
.qg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qt{display:flex;flex-direction:column;border-radius:6px;overflow:hidden;background:var(--card);border:1px solid var(--bd);height:62px;justify-content:center;align-items:center;gap:6px;font-size:12px;transition:background .15s}
.qt.on{background:var(--ac);border-color:transparent;color:#fff}
.sl{display:flex;align-items:center;gap:14px;margin-top:18px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:rgba(150,150,150,.5);outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ac2);border:4px solid var(--win);box-shadow:0 0 0 1px var(--ac2)}
.qb{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--bd);font-size:12px}
#cal{right:10px;bottom:56px;width:min(380px,96vw);max-height:calc(100% - 64px);overflow-y:auto;padding:0}
#cal .nt{padding:14px 18px;border-bottom:1px solid var(--bd)}
#cal .nt .h{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:8px}
.ntc{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:10px 12px;margin-bottom:8px;font-size:12px}
.ntc b{display:block;margin-bottom:2px}.ntc span{color:var(--sub)}
#cal .cl{padding:12px 18px 16px}
.ch{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px}
.ch button{width:32px;height:28px;border-radius:4px}.ch button:hover,.ch button:active{background:var(--hov)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cg span{height:34px;display:grid;place-items:center;font-size:12px;border-radius:50%}
.cg .w{color:var(--sub);font-size:11px;height:24px}
.cg .o{color:var(--sub);opacity:.5}
.cg .td{background:var(--ac);color:#fff;font-weight:600}
#wg{left:8px;bottom:56px;width:min(420px,96vw);height:min(560px,calc(100% - 64px));overflow-y:auto;padding:16px;background:var(--mica)}
.wh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.wh b{font-size:18px;font-weight:600}.wh span{font-size:12px;color:var(--sub)}
.wk{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:10px}
.wk h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--sub)}
.wt{display:flex;align-items:center;gap:14px}.wt b{font-size:40px;font-weight:300;line-height:1}
.wf{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;text-align:center;color:var(--sub)}
.td2{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--bd)}
.td2:last-child{border:0}
.ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--sub);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.td2.dn .ck{background:var(--ac);border-color:var(--ac)}.td2.dn span{text-decoration:line-through;color:var(--sub)}
.nw{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}
.nw:last-child{border:0}.nw i{flex:none;width:56px;height:56px;border-radius:6px}
#ctx{position:absolute;z-index:7000;background:var(--mica2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--bd);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:200px;display:none}
#ctx.on{display:block}#ctx button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 12px;border-radius:4px;font-size:13px}#ctx button:hover,#ctx button:active{background:var(--hov)}#ctx hr{border:0;border-top:1px solid var(--bd);margin:4px 8px}
#toast{position:absolute;right:14px;bottom:60px;z-index:8000;background:var(--mica2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--bd);border-radius:8px;padding:12px 16px;font-size:12.5px;box-shadow:var(--shadow);transform:translateX(120%);transition:transform .35s cubic-bezier(.2,.9,.3,1);max-width:min(320px,90vw)}
#toast.on{transform:none}
/* apps */
.app{height:100%;display:flex;flex-direction:column}
.side{flex:none;width:190px;padding:8px;overflow-y:auto;background:var(--win)}
.side .it{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:5px;font-size:13px;position:relative}
.side .it:hover{background:var(--hov)}.side .it.on{background:var(--card)}
.side .it.on:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--ac2)}
.row{display:flex;min-height:0;flex:1}
.main{flex:1;min-width:0;overflow:auto;padding:16px 20px}
.main h2{margin:0 0 14px;font-size:22px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:14px 16px;margin-bottom:6px;display:flex;align-items:center;gap:14px;justify-content:space-between}
.card small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.sg{display:flex;gap:6px;flex-wrap:wrap}.sg i{width:34px;height:34px;border-radius:50%;border:3px solid transparent;display:block;cursor:pointer}.sg i.on{border-color:var(--fg)}
.seg{display:flex;border:1px solid var(--bd);border-radius:5px;overflow:hidden}.seg button{padding:7px 14px;font-size:12.5px;background:var(--card)}.seg button.on{background:var(--ac);color:#fff}
.btn{background:var(--ac);color:#fff;border-radius:5px;padding:7px 16px;font-size:13px}.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.cmd{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--bd);background:var(--win);flex:none;align-items:center;font-size:12.5px;flex-wrap:nowrap;overflow-x:auto}
.cmd button{padding:6px 10px;border-radius:4px;display:flex;gap:6px;align-items:center;white-space:nowrap}.cmd button:hover,.cmd button:active{background:var(--hov)}
.adr{display:flex;gap:6px;padding:6px 10px;background:var(--win);flex:none;align-items:center}
.adr .bar{flex:1;min-width:0;height:30px;border-radius:5px;background:var(--inp);border:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:6px;font-size:12.5px;overflow:hidden;white-space:nowrap}
.adr button{width:30px;height:30px;border-radius:4px;display:grid;place-items:center;flex:none}.adr button:hover,.adr button:active{background:var(--hov)}
.fi{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:5px;font-size:13px}.fi:hover,.fi:active{background:var(--hov)}.fi small{margin-left:auto;color:var(--sub);font-size:12px;white-space:nowrap}
.fh{display:flex;padding:4px 10px 8px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--bd);margin-bottom:4px}.fh span:last-child{margin-left:auto}
.calc{display:grid;grid-template-rows:auto 1fr;height:100%;background:var(--win)}
.cdp{padding:14px 18px 6px;text-align:right;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end}
.cdp small{color:var(--sub);font-size:13px;min-height:18px;word-break:break-all}.cdp b{font-size:44px;font-weight:600;word-break:break-all;line-height:1.1}
.ckp{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:4px}
.ckp button{border-radius:5px;background:var(--win2);font-size:18px;min-height:38px;border:1px solid var(--bd)}.ckp button:active{opacity:.7}.ckp .o{background:var(--card)}.ckp .e{background:var(--ac);color:#fff}
.nt-ta{width:100%;height:100%;border:0;outline:0;resize:none;background:var(--win2);padding:12px;font-family:Consolas,"Courier New",monospace;font-size:14px}
.term{background:#0c0c0c;color:#ccc;height:100%;padding:8px 12px;font-family:Consolas,"Courier New",monospace;font-size:13px;overflow:auto}
.term .l{white-space:pre-wrap;word-break:break-word;min-height:17px}
.term .in{display:flex;gap:6px}.term input{flex:1;min-width:0;background:none;border:0;outline:0;color:#ccc;font-family:inherit;font-size:inherit}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;padding:12px}.ph i{display:block;aspect-ratio:1;border-radius:4px}
.sx{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:16px}
.sx .a{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px}
.sx .a small{color:var(--sub)}
.eb{height:100%;display:flex;flex-direction:column}.eb .pg2{flex:1;min-height:0;position:relative;background:var(--win2)}
.eb iframe{width:100%;height:100%;border:0;background:#fff}
.hm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;height:100%;padding:20px;background:linear-gradient(160deg,var(--win2),var(--win))}
.hm .sr{display:flex;align-items:center;gap:10px;width:min(480px,92%);height:44px;border-radius:22px;background:var(--inp);border:1px solid var(--bd);padding:0 16px}
.hm input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15px}
.tl{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.tl div{width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;padding:8px 2px;border-radius:6px}.tl div:hover,.tl div:active{background:var(--hov)}

    else if(k=='x²'||k=='√'||k=='1/x'||k=='±'){var v2=parseFloat(ev(ex||res));if(!isNaN(v2)){var r2=k=='x²'?v2*v2:k=='√'?Math.sqrt(v2):k=='±'?-v2:1/v2;ex=String(+r2.toFixed(10));res=ex}}
    else if(k=='='){if(ex){last=ex+' =';res=ev(ex);ex=(res=='Erro'||/zero/.test(res))?'':res}}
    show()};show()},
notes:function(b){b.innerHTML='<textarea class="nt-ta" placeholder="Digite aqui..."></textarea>';var t=b.querySelector('textarea');t.value=LS.get('note','');t.oninput=function(){LS.set('note',t.value)}},
photos:function(b){var C=[['#4cc2ff','#1d4ed8'],['#ffb36b','#e0457b'],['#6ee7b7','#0e9f6e'],['#c4b5fd','#7c3aed'],['#fde68a','#f59e0b'],['#fca5a5','#dc2626'],['#93c5fd','#2563eb'],['#a7f3d0','#047857'],['#f9a8d4','#be185d'],['#bae6fd','#0284c7'],['#fcd34d','#b45309'],['#d8b4fe','#9333ea']];
  b.innerHTML='<div class="ph">'+C.map(function(c,i){return'<i style="background:linear-gradient(135deg,'+c[0]+','+c[1]+')" data-i="'+i+'"></i>'}).join('')+'</div>';b.onclick=function(e){if(e.target.tagName=='I')toast('Foto '+(+e.target.getAttribute('data-i')+1)+' de 12')}},
term:function(b){b.innerHTML='<div class="term" id="tm"><div class="l">Windows PowerShell\nCopyright (C) Microsoft Corporation. Todos os direitos reservados.\n</div><div class="in"><span>PS C:\\Users\\Usuário&gt;</span><input id="ti" autocomplete="off" autocapitalize="off"></div></div>';
  var tm=b.querySelector('#tm'),ti=b.querySelector('#ti'),inn=b.querySelector('.in');
  function out(t){var d=document.createElement('div');d.className='l';d.textContent=t;tm.insertBefore(d,inn)}
  ti.onkeydown=function(e){if(e.key!='Enter')return;var c=ti.value.trim(),l=c.toLowerCase();out('PS C:\\Users\\Usuário> '+c);ti.value='';
    if(l=='help')out('Comandos: help, date, time, echo, ver, dir, whoami, hostname, cls, exit');else if(l=='date'||l=='time')out(new Date().toLocaleString('pt-BR'));
    else if(l.indexOf('echo ')==0)out(c.slice(5));else if(l=='ver')out('Microsoft Windows [Versão 10.0.22631.4037]');else if(l=='whoami')out('pc\\usuario');else if(l=='hostname')out('PC-WIN11');
    else if(l=='dir'||l=='ls')out('    Diretório: C:\\Users\\Usuário\n\nMode   Nome\n----   ----\nd----- Área de Trabalho\nd----- Documentos\nd----- Downloads\nd----- Imagens');
    else if(l=='cls'||l=='clear'){[].slice.call(tm.querySelectorAll('.l')).forEach(function(x){x.remove()})}else if(l=='exit')closeW('term');else if(l)out(c.split(' ')[0]+' : O termo \''+c.split(' ')[0]+'\' não é reconhecido como nome de cmdlet.');
    tm.scrollTop=tm.scrollHeight};b.onclick=function(){ti.focus()}},
trash:function(b){b.innerHTML='<div class="hm" style="gap:8px">'+ic('trash',72)+'<div style="font-size:16px;font-weight:600">A Lixeira está vazia</div><div style="color:var(--sub)">Os itens excluídos aparecem aqui.</div></div>'}};
/* ---------- misc ---------- */
function setWall(i){$('wall').className=i?'w'+i:''}
function lockNow(){closeFly();$('login').className='';$('lock').className='';tick()}
document.addEventListener('pointerdown',function(ev){var t=ev.target;
  if(!(t.closest&&(t.closest('.fly')||t.closest('#tb')||t.closest('#ctx'))))closeFly()},true);
$('lock').onclick=function(){this.className='up';$('login').className='on';setTimeout(function(){try{$('pin').focus()}catch(x){}},400)};
function enter(){$('login').className='gone';$('pin').value='';toast('Bem-vindo, Usuário')}
$('go').onclick=enter;$('pin').onkeydown=function(e){if(e.key=='Enter')enter()};
$('off').onclick=function(){this.style.display='none';lockNow()};
$('tbc').onclick=function(ev){var b=ev.target.closest('[data-t],[data-a]');if(!b)return;var t=b.getAttribute('data-t'),a=b.getAttribute('data-a');
  if(a){var w=W[a];if(w&&!w.min&&act==a)minW(a);else openApp(a);return}
  if(t=='start'){flyTog('start')}else if(t=='search'){if(flyTog('start'))setTimeout(function(){$('sq').focus()},120)}else if(t=='wg')flyTog('wg');
  else if(t=='tv'){closeFly();var ks=Object.keys(W);if(!ks.length)toast('Nenhuma janela aberta');else ks.forEach(function(k){if(W[k].min){W[k].min=false;W[k].el.classList.remove('min')}});tbRender()}};
$('tbw').onclick=function(){flyTog('wg')};
$('tqs').onclick=function(){flyTog('qs')};$('tcl').onclick=function(){flyTog('cal')};$('tnt').onclick=function(){flyTog('cal')};$('tchev').onclick=function(){toast('Ícones ocultos: nenhum')};
$('sd').onclick=function(){closeFly();Object.keys(W).forEach(function(k){W[k].min=true;W[k].el.classList.add('min')});act=null;focusW(null)};
$('sq').oninput=function(){startRender(this.value)};
$('sq').onkeydown=function(e){if(e.key=='Enter'){var r=Object.keys(APPS).filter(function(id){return APPS[id].n.toLowerCase().indexOf($('sq').value.toLowerCase().trim())>=0})[0];if(r)openApp(r)}};
$('sbody').onclick=function(ev){var o=ev.target.closest('[data-o]'),s=ev.target.closest('[data-s]');
  if(o)openApp(o.getAttribute('data-o'));else if(s){var k=s.getAttribute('data-s');if(k=='all'){startRender.all=true;startRender()}else if(k=='pin'){startRender.all=false;startRender()}else toast('Sem mais itens recomendados')}};
$('usr').onclick=function(){closeFly();lockNow()};
$('pw').onclick=function(){$('pm').classList.toggle('on')};
$('pm').onclick=function(ev){var p=ev.target.getAttribute('data-p');if(!p)return;closeFly();if(p=='sleep')lockNow();else if(p=='off'){$('off').style.display='grid'}else{location.reload()}};
$('qg').onclick=function(ev){var q=ev.target.closest('[data-q]');if(!q)return;var k=q.getAttribute('data-q');qsS[k]=qsS[k]?0:1;if(k=='nl')$('nl').style.opacity=qsS.nl?'1':'0';qsRender()};
$('rb').oninput=function(){$('dim').style.opacity=(100-this.value)/130};
$('nclr').onclick=function(){NT=[];LS.set('nt',NT);ntRender()};
$('cpv').onclick=function(){cm--;if(cm<0){cm=11;cy--}calRender()};$('cnx').onclick=function(){cm++;if(cm>11){cm=0;cy++}calRender()};
$('wg').onclick=function(ev){var t=ev.target.closest('[data-td]');if(!t)return;var i=+t.getAttribute('data-td');TODO[i].d=TODO[i].d?0:1;LS.set('todo',TODO);wgRender()};
$('icons').onclick=function(ev){var d=ev.target.closest('.di');[].forEach.call(document.querySelectorAll('.di'),function(x){x.classList.toggle('sel',x===d)})};
$('icons').ondblclick=function(ev){var d=ev.target.closest('.di');if(d)openApp(d.getAttribute('data-o'))};
(function(){var lt=0;$('icons').addEventListener('pointerup',function(ev){var d=ev.target.closest('.di');if(!d)return;var n=Date.now();if(ev.pointerType=='touch'||n-lt<350)openApp(d.getAttribute('data-o'));lt=n})})();
$('desk').addEventListener('contextmenu',function(ev){if(ev.target.closest('.win'))return;ev.preventDefault();var c=$('ctx');
  c.innerHTML='<button data-c="r">🔄 Atualizar</button><hr><button data-c="p">🎨 Personalizar</button><button data-c="s">🖥️ Configurações de exibição</button><button data-c="t">⌨️ Abrir no Terminal</button>';
  c.style.left=Math.min(ev.clientX,innerWidth-210)+'px';c.style.top=Math.min(ev.clientY,innerHeight-190)+'px';c.classList.add('on')});
$('ctx').onclick=function(ev){var k=ev.target.closest('[data-c]');if(!k)return;k=k.getAttribute('data-c');$('ctx').classList.remove('on');if(k=='r')toast('Área de trabalho atualizada');else if(k=='t')openApp('term');else openApp('settings')};
if(navigator.getBattery)navigator.getBattery().then(function(b){function u(){$('bat').textContent=(b.charging?'⚡ ':'🔋 ')+Math.round(b.level*100)+'%'}u();b.onlevelchange=b.onchargingchange=u}).catch(function(){});
document.addEventListener('keydown',function(e){if(e.key=='Escape')closeFly();if(e.key=='Meta'||(e.ctrlKey&&e.key=='Escape')){e.preventDefault();flyTog('start')}});
window.addEventListener('resize',function(){var ds=deskSize();Object.keys(W).forEach(function(k){var el=W[k].el;if(!el.classList.contains('max')){el.style.left=Math.max(0,Math.min(parseInt(el.style.left)||0,ds.w-120))+'px';el.style.top=Math.max(0,Math.min(parseInt(el.style.top)||0,ds.h-40))+'px'}})});
/* restore saved look */
if(LS.get('theme','dark')=='light')document.body.classList.add('light');
var sa=LS.get('acc','');if(sa)document.documentElement.style.setProperty('--ac',sa);
setWall(LS.get('wall',0));
build();tick();setInterval(function(){tick();if($('wg').classList.contains('on'))wgRender()},20000);setInterval(tick,1000);
</script>
