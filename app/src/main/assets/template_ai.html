<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nova AI</title>
<style>
:root{--bg:#12131a;--panel:#1b1d27;--line:#2a2d3a;--txt:#e9e8f2;--sub:#9a9bb0;--acc:#8b7cff;--acc2:#4fd1c5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 system-ui,-apple-system,Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line)}
.mark{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,var(--acc),var(--acc2),var(--acc));display:grid;place-items:center;color:#fff;font-size:15px}
header b{font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:17px;letter-spacing:.2px}
header .sp{flex:1}.pill{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
#key{display:none;width:150px;font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--acc);background:var(--panel);color:var(--txt);outline:0}
#scroll{flex:1;min-height:0;overflow-y:auto;padding:0 12px}
#col{max-width:820px;margin:0 auto;padding:8px 0 6px}
#hello{text-align:center;padding:4vh 0 1vh}
#hello .mark{width:34px;height:34px;font-size:18px;margin:0 auto 8px;border-radius:11px}
#hello h1{font:400 22px/1.2 Georgia,'Times New Roman',serif;margin:0 0 4px}
#hello p{color:var(--sub);margin:0}
.ex{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.ex button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:5px 10px;font-size:12px}
.u{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 12px;margin:8px 0 4px auto;width:fit-content;max-width:88%;white-space:pre-wrap;word-break:break-word}
.u small{display:block;color:var(--acc2);font-size:11px;margin-top:2px}
.a{margin:4px 0 10px;display:flex;gap:10px}.a .mark{flex:none;margin-top:3px;width:24px;height:24px;font-size:13px}
.a .b{flex:1;min-width:0;font-family:Georgia,'Times New Roman',serif;font-size:15.5px;line-height:1.5}
.a p{margin:0 0 6px;white-space:pre-wrap;word-break:break-word}
.code{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0;background:#0c0d12;font-family:ui-monospace,Menlo,Consolas,monospace}
.code .h{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--panel);color:var(--sub);font-size:12px}
.code .h button{background:none;border:0;color:var(--acc2);font-size:12px}
.code pre{margin:0;padding:12px;overflow-x:auto;font-size:13px;line-height:1.5;color:#d8d6ff}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--acc);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
#bar{padding:4px 12px calc(8px + env(safe-area-inset-bottom))}
#box{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 8px}
#box:focus-within{border-color:var(--acc)}
#q{flex:1;min-width:0;border:0;outline:0;resize:none;background:none;color:var(--txt);font:inherit;font-size:15px;line-height:1.35;max-height:96px;padding:6px 4px}
#row{display:flex;gap:8px;align-items:center}
#sp{flex:0 0 118px;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:16px;padding:6px 10px;font-size:12px;outline:0;align-self:center}
#go{flex:none;width:34px;height:34px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:18px}
#go:disabled{opacity:.4}
#mic{flex:none;width:34px;height:34px;border:0;border-radius:12px;background:var(--bg);color:var(--txt);font-size:16px}
#mic.on{background:#ff3355}
.note{text-align:center;color:var(--sub);font-size:11px;margin-top:8px}
</style></head><body>
<header><div class=mark>✦</div><b>Nova</b><span class=pill>TermWin</span><span class=sp></span><button id=apib class=pill style="background:none;color:var(--acc2);border-color:var(--acc2)">🔑 API</button><input id=key placeholder="Chave twk_… ou do provedor"></header>
<div id=scroll><div id=col>
<div id=hello><div class=mark>✦</div><h1>Como posso ajudar hoje?</h1><p>Pergunte algo ou peça um código — em qualquer linguagem.</p>
<div class=ex><button>Crie um jogo de pulo em GDScript</button><button>Selection sort em Python</button><button>Explique o que é uma API</button></div></div>
</div></div>
<div id=bar><div id=box><input id=sp placeholder="App (opcional)"><textarea id=q rows=1 placeholder="Escreva sua pergunta…"></textarea><button id=mic title="Falar">🎤</button><button id=go>↑</button></div><div class=note id=nt></div></div>
<script>
var col=document.getElementById('col'),sc=document.getElementById('scroll'),q=document.getElementById('q'),sp=document.getElementById('sp'),go=document.getElementById('go'),kb=document.getElementById('key');
var tok='';try{tok=(location.hash.match(/t=([\w-]+)/)||[])[1]||localStorage.getItem('twk')||''}catch(e){}
if(!tok){kb.style.display='block'}
var nt=document.getElementById('nt');
function note(m){nt.textContent=m;setTimeout(function(){nt.textContent=''},6000)}
document.getElementById('apib').onclick=function(){kb.style.display=kb.style.display=='block'?'none':'block';if(kb.style.display=='block')kb.focus()};
kb.onchange=function(){var v=kb.value.trim();if(!v)return;
  if(/^twk_/.test(v)){tok=v;try{localStorage.setItem('twk',v)}catch(e){}}
  if(window.TW&&TW.saveKey)TW.saveKey(v);else note(/^twk_/.test(v)?'Chave twk_ guardada neste navegador':'Cole chaves de provedor dentro do app TermWin')};
window.onKey=function(ok,m){note(m);if(ok){kb.value='';kb.style.display='none'}};
function esc(t){return t.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function render(t){var parts=t.split('```'),h='';
  for(var i=0;i<parts.length;i++){
    if(i%2==0){if(parts[i].trim())h+='<p>'+esc(parts[i].trim())+'</p>'}
    else{var p=parts[i],nl=p.indexOf('\n'),lang=nl>=0?p.slice(0,nl).trim():'',code=nl>=0?p.slice(nl+1):p;
      h+='<div class=code><div class=h><span>'+esc(lang||'code')+'</span><button onclick="cp(this)">Copiar</button></div><pre>'+esc(code.replace(/\n$/,''))+'</pre></div>'}}
  return h}
function cp(b){var t=b.parentNode.nextSibling.textContent;if(navigator.clipboard)navigator.clipboard.writeText(t);b.textContent='Copiado ✔';setTimeout(function(){b.textContent='Copiar'},1500)}
function addU(t,s){var d=document.createElement('div');d.className='u';d.textContent=t;if(s){var m=document.createElement('small');m.textContent=s;d.appendChild(m)}col.appendChild(d)}
function addA(){var d=document.createElement('div');d.className='a';d.innerHTML='<div class=mark>✦</div><div class=b><div class=dots><span></span><span></span><span></span></div></div>';col.appendChild(d);return d.lastChild}
function send(t){t=t.trim();if(!t)return;var s=sp.value.trim();var hl=document.getElementById('hello');if(hl)hl.remove();
  addU(t,s);var b=addA();q.value='';q.style.height='auto';go.disabled=true;sc.scrollTop=sc.scrollHeight;
  fetch('/ask?q='+encodeURIComponent(t)+'&spec='+encodeURIComponent(s)+'&key='+encodeURIComponent(tok)).then(function(r){return r.json()}).then(function(j){
    b.innerHTML=render(j.answer);if(/^401/.test(j.answer))kb.style.display='block'}).catch(function(e){b.textContent='Erro: '+e}).then(function(){go.disabled=false;sc.scrollTop=sc.scrollHeight})}
go.onclick=function(){send(q.value)};
q.onkeydown=function(e){if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();send(q.value)}};
q.oninput=function(){q.style.height='auto';q.style.height=Math.min(96,q.scrollHeight)+'px'};
var mic=document.getElementById('mic');
mic.onclick=function(){if(window.TW&&TW.listen){mic.className='on';TW.listen()}else note('O microfone funciona dentro do app TermWin')};
window.onVoice=function(st,tx){if(st=='partial')q.value=tx;else if(st=='final'){mic.className='';q.value=tx;send(tx)}else if(st=='error'){mic.className='';note(tx||'Não ouvi nada')}};
document.querySelector('.ex').onclick=function(e){if(e.target.tagName=='BUTTON')send(e.target.textContent)};
</script></body></html>
